name: Autograding Tests
on:
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.20
      options: --user root
    
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      # This is where you place your autograding tests
      # For more information on this runner, see the documentation at: https://github.com/classroom-resources/autograding-io-grader
      #
      # For example, you could run a test suite like this:
      # - name: Run tests
      #   uses: classroom-resources/autograding-io-grader@v1
      #     with:
      #       test-name: Addition Test
      #       id: addition-test
      #       command: "./bin/add.sh"
      #       input: 1 2
      #       expected-output: 3
      #       comparison-method: exact
      #       timeout: 10
    - name: Run coq verifier
      id: coq-verifier
      run: /home/coq/.opam/4.13.1+flambda/bin/coqtop -batch -silent -l FPIntro.v && echo "result=OK" >> $GITHUB_OUTPUT

    # - name: Autograding Reporter
    #   uses: classroom-resources/autograding-grading-reporter@v1
    #   # For more information on this runner, see the documentation at https://github.com/classroom-resources/autograding-grading-reporter
